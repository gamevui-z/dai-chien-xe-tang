name: Apply cloud save hotfix
on:
  push:
    paths:
      - '.github/workflows/apply-save-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch save adapter
        run: |
          python .github/scripts/patch_save_a.py
          python .github/scripts/patch_history.py
          python .github/scripts/patch_retry.py
      - name: Validate
        run: |
          node --check gamevui-save.js
          grep -q 'GV_BUILD", 3' gamevui-save.js
          grep -q 'gamevui-save.js?v=3' index.html
          grep -q 'GV_LOAD_RETRY' gamevui-save.js
          grep -q 'return withTimeout(getHistory(), 5000)' gamevui-save.js
      - name: Commit patched runtime
        run: |
          git config user.name 'gamevui-bot'
          git config user.email 'gamevui-bot@users.noreply.github.com'
          git add gamevui-save.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: correct cloud load retry and cross-device sync'
          git push origin HEAD:main
