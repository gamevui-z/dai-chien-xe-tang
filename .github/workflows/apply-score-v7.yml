name: Apply score v8
on:
  push:
    paths:
      - '.github/scripts/patch_v8.py'
      - '.github/workflows/apply-score-v7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v8
        run: |
          python .github/scripts/patch_v8.py
          node --check gamevui-save.js
          grep -q 'GV_BUILD", 8' gamevui-save.js
          grep -q 'GV_PREFS_BYTE_DELTA' gamevui-save.js
          grep -q 'gamevui-save.js?v=8' index.html
          git diff --check
          git config user.name gamevui-bot
          git config user.email gamevui-bot@users.noreply.github.com
          git add gamevui-save.js index.html
          git commit -m 'diag: trace score candidates from cloud PlayerPrefs bytes'
          git push origin HEAD:main
