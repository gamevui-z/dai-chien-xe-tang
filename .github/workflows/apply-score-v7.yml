name: Apply score v9
on:
  push:
    paths:
      - '.github/scripts/patch_v9a.py'
      - '.github/workflows/apply-score-v7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v9
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v9a.py')
          s=p.read_text()
          s=s.replace("helper=r'''", "helper='''", 1)
          p.write_text(s)
          PY
          python .github/scripts/patch_v9a.py
          node --check gamevui-save.js
          node --check game.js
          grep -q 'GV_BUILD", 9' gamevui-save.js
          grep -q 'GV_FS_MAP' gamevui-save.js
          grep -q 'GV_FS_MONEY' gamevui-save.js
          grep -q 'GV_SCORE_SUBMIT' gamevui-save.js
          grep -q '__gvUnityFS' game.js
          grep -q 'gamevui-save.js?v=9' index.html
          git diff --check
          git config user.name gamevui-bot
          git config user.email gamevui-bot@users.noreply.github.com
          git add game.js gamevui-save.js index.html
          git commit -m 'fix: read persisted Unity FS money for GameVui score'
          git push origin HEAD:main
