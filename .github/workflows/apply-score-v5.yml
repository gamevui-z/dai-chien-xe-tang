name: Apply score v5
on:
  push:
    paths:
      - '.github/workflows/apply-score-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v5
        run: python .github/scripts/patch_v5_score.py
      - name: Validate
        run: |
          node --check gamevui-save.js
          grep -q 'GV_BUILD", 5' gamevui-save.js
          grep -q 'gamevui-save.js?v=5' index.html
          grep -q 'GV_UNITY_FS_SYNC' gamevui-save.js
          grep -q 'moneyishFromRaw' gamevui-save.js
          grep -q '__gvUnityInstance' index.html
      - name: Commit runtime v5
        run: |
          git config user.name 'gamevui-bot'
          git config user.email 'gamevui-bot@users.noreply.github.com'
          git add gamevui-save.js index.html
          git diff --cached --check
          git commit -m 'fix: read current currency before GameVui score submit'
          git push origin HEAD:main
