name: Apply cloud save v4
on:
  push:
    paths:
      - '.github/workflows/apply-save-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v4
        run: |
          python .github/scripts/patch_v4_history.py
          python .github/scripts/patch_v4_score.py
      - name: Validate
        run: |
          node --check gamevui-save.js
          grep -q 'GV_BUILD", 4' gamevui-save.js
          grep -q 'gamevui-save.js?v=4' index.html
          grep -q 'hasExplicitEmptyMeta' gamevui-save.js
          grep -q 'parseUnityPrefs' gamevui-save.js
          grep -q 'GV_PREFS_MONEY' gamevui-save.js
      - name: Commit runtime v4
        run: |
          git config user.name 'gamevui-bot'
          git config user.email 'gamevui-bot@users.noreply.github.com'
          git add gamevui-save.js index.html
          git diff --cached --check
          git commit -m 'fix: accept empty GameVui metadata and parse Unity PlayerPrefs score'
          git push origin HEAD:main
